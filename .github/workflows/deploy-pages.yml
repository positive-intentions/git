name: Deploy to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # git-gallery patches whatsup-ui to ../../whatsup-ui (sibling of this repo).
      - name: Checkout whatsup-ui sibling
        uses: actions/checkout@v4
        with:
          repository: positive-intentions/whatsup-ui
          path: _whatsup-ui

      - name: Link whatsup-ui for Cargo patch
        run: |
          # From git-gallery, ../../whatsup-ui → $(dirname $GITHUB_WORKSPACE)/whatsup-ui
          ln -sfn "$GITHUB_WORKSPACE/_whatsup-ui" "$(dirname "$GITHUB_WORKSPACE")/whatsup-ui"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          targets: wasm32-unknown-unknown

      - name: Install nightly for coverage HTML
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: pages-gallery

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.6 --locked -y

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install gallery npm deps
        working-directory: git-gallery
        run: npm ci

      - name: Generate coverage HTML for gallery
        run: >
          cargo +nightly llvm-cov -p git-core
          --html --output-dir git-gallery/assets/coverage-html

      - name: Set Dioxus base_path for GitHub Pages
        run: sed -i '/\[web.app\]/a base_path = "git"' git-gallery/Dioxus.toml

      - name: Build gallery
        working-directory: git-gallery
        run: dx build --release --platform web --bin git-gallery

      - name: Prepare Pages artifact
        run: |
          OUT="git-gallery/target/dx/git-gallery/release/web/public"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: git-gallery/target/dx/git-gallery/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
